<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy New Year 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Great+Vibes&family=Outfit:wght@300;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #03030a;
            --gold: #FFD700;
            --gold-gradient: linear-gradient(135deg, #FFD700 0%, #FDB931 100%);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-blue: #00f3ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            height: 100vh;
            perspective: 1000px;
            /* For 3D effects */
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* --- UI LAYER --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- INTRO STATE --- */
        .envelope-container {
            text-align: center;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .envelope-glow {
            position: relative;
            padding: 3rem 4rem;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--gold);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.1), inset 0 0 20px rgba(255, 215, 0, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 4px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .envelope-glow:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.3), inset 0 0 30px rgba(255, 215, 0, 0.1);
        }

        .stamp {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 1.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--gold);
            display: inline-block;
            padding-bottom: 0.5rem;
        }

        .tap-hint {
            font-size: 0.8rem;
            opacity: 0.6;
            margin-top: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- COUNTDOWN STATE --- */
        #countdown-display {
            font-family: 'Outfit', sans-serif;
            font-size: 12rem;
            font-weight: 700;
            color: transparent;
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.8);
            display: none;
            opacity: 0;
            transform: scale(0.5);
            text-shadow: 0 0 50px rgba(255, 255, 255, 0.5);
        }

        .countdown-animate {
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* --- CELEBRATION STATE (3D CARD) --- */
        #celebration-card {
            display: none;
            position: relative;
            transform-style: preserve-3d;
            transform: perspective(1000px);
            width: 80%;
            max-width: 800px;
            padding: 4rem;
            background: rgba(10, 10, 15, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .card-content {
            transform: translateZ(60px);
            /* Pops text out */
        }

        h1.neon-title {
            font-family: 'Great Vibes', cursive;
            font-size: 6rem;
            color: #fff;
            text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 40px var(--neon-blue), 0 0 80px var(--neon-blue);
            margin-bottom: -1rem;
        }

        h2.gold-year {
            font-family: 'Cinzel', serif;
            font-size: 10rem;
            line-height: 1;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.6));
            transform: scale(0.9);
            transition: transform 0.5s ease;
        }

        h2.gold-year:hover {
            transform: scale(1);
        }

        p.message {
            margin-top: 2rem;
            font-size: 1.4rem;
            line-height: 1.6;
            color: #ccc;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            padding: 1rem;
            border-radius: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* --- UTILS --- */
        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        .fade-out {
            opacity: 0 !important;
            transition: opacity 0.5s ease;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }

            50% {
                opacity: 1;
                transform: scale(1.1);
            }

            100% {
                opacity: 0;
                transform: scale(1.5);
            }

            /* Fades out at end of beat */
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1.neon-title {
                font-size: 3.5rem;
            }

            h2.gold-year {
                font-size: 6rem;
            }

            #celebration-card {
                padding: 2rem;
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <audio id="bg-music" loop>
        <!-- Remote URL restored as requested for better experience, with local fallback -->
        <!-- https://raw.githubusercontent.com/srdjangosevski/css-greeting-card/master/assets/mp3/song.mp3 -->
        <source src="" type="audio/mpeg">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div id="canvas-container">
        <canvas id="mainCanvas"></canvas>
    </div>

    <div id="ui-layer">

        <!-- INTRO -->
        <div id="intro" class="envelope-container">
            <div class="envelope-glow" id="open-btn">
                <div class="stamp">Top Secret</div>
                <div style="font-size: 1.5rem; margin: 0.5rem 0;">New Year Protocol</div>
                <div class="tap-hint">[ Click to Initialize ]</div>
            </div>
        </div>

        <!-- COUNTDOWN -->
        <div id="countdown-display">3</div>

        <!-- CELEBRATION -->
        <div id="celebration-card">
            <div class="card-content">
                <h1 class="neon-title">Happy New Year</h1>
                <h2 class="gold-year">2026</h2>
                <p class="message">
                    May this year bring you the courage to fly, the strength to endure, and the happiness you deserve.
                    <br><span style="font-size: 0.9rem; opacity: 0.7; margin-top: 10px; display: block;">&hearts; From
                        Me</span>
                </p>
            </div>
        </div>

    </div>

    <script>
        // --- CONSTANTS & SETUP ---
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        const STATE = {
            INTRO: 0,
            COUNTDOWN: 1,
            CELEBRATION: 2
        };
        let currentState = STATE.INTRO;

        // Resize
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- CLASSES ---

        // 1. STARFIELD (Background)
        class Star {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = (Math.random() - 0.5) * width;
                this.y = (Math.random() - 0.5) * height;
                this.z = Math.random() * width; // Depth
                this.pz = this.z;
            }
            update(speed) {
                this.z = this.z - speed;
                if (this.z < 1) {
                    this.reset();
                    this.z = width;
                    this.pz = this.z;
                }
            }
            draw() {
                // Perspective projection
                const sx = (this.x / this.z) * width / 2 + width / 2;
                const sy = (this.y / this.z) * height / 2 + height / 2;

                const r = (width - this.z) / width * 2.5; // Size based on depth

                // Trail effect (optional, simple line for speed)
                /*
                const px = (this.x / this.pz) * width/2 + width/2;
                const py = (this.y / this.pz) * height/2 + height/2;
                this.pz = this.z;
                
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(sx, sy);
                ctx.strokeStyle = `rgba(255, 255, 255, ${r/2})`;
                ctx.stroke();
                */

                ctx.beginPath();
                ctx.arc(sx, sy, r, 0, Math.PI * 2);
                ctx.fillStyle = "white";
                ctx.fill();
            }
        }

        // 2. FIREWORKS (Physics Based)
        class Particle {
            constructor(x, y, hue, fireworkRef) {
                this.x = x;
                this.y = y;
                this.fireworkRef = fireworkRef;

                // Random spread
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;

                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;

                this.hue = hue;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.005;
                this.gravity = 0.05;
                this.friction = 0.96;
            }
            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = `hsl(${this.hue}, 100%, 60%)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        class Firework {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = height;
                this.targetY = Math.random() * (height * 0.4) + height * 0.1;
                this.speed = Math.random() * 3 + 8;
                this.hue = Math.random() * 360;
                this.particles = [];
                this.exploded = false;
                this.dead = false;
            }
            update() {
                if (!this.exploded) {
                    this.y -= this.speed;
                    this.speed *= 0.98; // Drag

                    if (this.y <= this.targetY || this.speed < 1) {
                        this.explode();
                    }
                } else {
                    for (let i = this.particles.length - 1; i >= 0; i--) {
                        this.particles[i].update();
                        if (this.particles[i].alpha <= 0) this.particles.splice(i, 1);
                    }
                    if (this.particles.length === 0) this.dead = true;
                }
            }
            explode() {
                this.exploded = true;
                for (let i = 0; i < 80; i++) {
                    this.particles.push(new Particle(this.x, this.y, this.hue, this));
                }
            }
            draw() {
                if (!this.exploded) {
                    ctx.fillStyle = `hsl(${this.hue}, 100%, 50%)`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    this.particles.forEach(p => p.draw());
                }
            }
        }

        // --- MANAGERS ---
        const stars = Array(400).fill().map(() => new Star());
        let fireworks = [];
        let warpSpeed = 2; // Speed of stars

        // --- LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // Cleanup & Background
            // Trail effect for fireworks, but we want clean stars.
            // So we partially clear with low opacity black
            ctx.fillStyle = `rgba(3, 3, 10, 0.2)`;
            ctx.fillRect(0, 0, width, height);

            // Stars
            let currentWarp = (currentState === STATE.COUNTDOWN) ? 20 : (currentState === STATE.CELEBRATION ? 0.5 : 2);
            // Smooth transition of warp speed
            warpSpeed += (currentWarp - warpSpeed) * 0.05;

            stars.forEach(star => {
                star.update(warpSpeed);
                star.draw();
            });

            // Fireworks (Only in Celebration)
            if (currentState === STATE.CELEBRATION) {
                if (Math.random() < 0.05) {
                    fireworks.push(new Firework());
                }

                for (let i = fireworks.length - 1; i >= 0; i--) {
                    fireworks[i].update();
                    fireworks[i].draw();
                    if (fireworks[i].dead) fireworks.splice(i, 1);
                }
            }
        }
        animate();


        // --- LOGIC ---
        const openBtn = document.getElementById('open-btn');
        const introDiv = document.getElementById('intro');
        const countdownDiv = document.getElementById('countdown-display');
        const celebrationCard = document.getElementById('celebration-card');
        const audio = document.getElementById('bg-music');

        openBtn.addEventListener('click', () => {
            // 1. Play Audio
            audio.volume = 0.5;
            audio.play().catch(e => console.log("Audio issue:", e));

            // 2. Transition to Countdown
            introDiv.classList.add('fade-out');
            setTimeout(() => {
                introDiv.style.display = 'none';
                startCountdown();
            }, 500);
        });

        function startCountdown() {
            currentState = STATE.COUNTDOWN;
            countdownDiv.style.display = 'block';

            let count = 3;
            countdownDiv.innerText = count;
            countdownDiv.classList.add('countdown-animate');

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    // Reset animation
                    countdownDiv.classList.remove('countdown-animate');
                    void countdownDiv.offsetWidth; // Trigger reflow
                    countdownDiv.classList.add('countdown-animate');
                    countdownDiv.innerText = count;
                } else {
                    clearInterval(timer);
                    startCelebration();
                }
            }, 1000);
        }

        function startCelebration() {
            countdownDiv.style.display = 'none';
            currentState = STATE.CELEBRATION;

            celebrationCard.style.display = 'block';
            // Simple pop-in animation via CSS is handled, but let's ensure it starts fresh
            // Add parallax mouse effect
            document.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
                celebrationCard.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });
        }
    </script>
</body>

</html>
